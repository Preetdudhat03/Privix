name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          # Grabs the version string from pubspec.yaml
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "Extracted version: v$VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ env.APP_VERSION }}$"; then
            echo "Tag ${{ env.APP_VERSION }} already exists. Skipping release."
            echo "exists=true" >> $GITHUB_ENV
          else
            echo "Tag ${{ env.APP_VERSION }} does not exist. Creating release."
            echo "exists=false" >> $GITHUB_ENV
          fi

      - name: Create Release
        if: env.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
