name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Run Code Analysis
        run: flutter analyze

      - name: 🛠️ Build Release APK
        run: flutter build apk --release

      - name: 🏷️ Rename APK for Release
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Privix-${TAG_NAME}.apk"

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Privix-*.apk
          name: Privix Release ${{ github.ref_name }}
          body: |
            ## Privix App Release ${{ github.ref_name }} 🛡️

            ### ✨ Features in this Build:
            - **Zero-Latency App Lock**: Instant 0ms AMOLED black curtain overlay protection.
            - **Smart Category Presets**: 1-tap sensitive app locking & category filters.
            - **Butter-Smooth Performance**: Native Kotlin icon scaling & LRU memory caching.
            - **Flexible Auth**: System Biometrics (Fingerprint/Face) + PIN keypad.

            ---
            ### 📥 Installation:
            1. Download `Privix-${{ github.ref_name }}.apk` below.
            2. Install on Android 7.0+ (API 24+).
            3. Grant **Accessibility Service** and **Draw Over Apps** permissions when prompted.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
