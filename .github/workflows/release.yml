name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Run Code Analysis
        run: flutter analyze

      - name: 🛠️ Build Release APK
        run: flutter build apk --release

      - name: 🏷️ Prepare APK Artifacts
        id: prepare_apk
        run: |
          REF_NAME="${GITHUB_REF_NAME:-v2.0.0}"
          if [[ "$REF_NAME" == "main" ]]; then
            REF_NAME="v2.0.0"
          fi
          APK_NAME="Privix-${REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "target_tag=${REF_NAME}" >> $GITHUB_OUTPUT

      - name: 📤 Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 🚀 Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.target_tag }}
          files: build/app/outputs/flutter-apk/Privix-*.apk
          name: Privix Release ${{ steps.prepare_apk.outputs.target_tag }}
          body: |
            ## Privix App Release ${{ steps.prepare_apk.outputs.target_tag }} 🛡️

            ### ✨ Features in this Build:
            - **Zero-Latency App Lock**: Instant 0ms AMOLED black curtain overlay protection.
            - **Samsung One UI Edge Panel Fix**: State machine window classification to prevent re-lock loops.
            - **Smart Category Presets**: 1-tap sensitive app locking & category filters.
            - **Butter-Smooth Performance**: Native Kotlin icon scaling & LRU memory caching.
            - **Flexible Auth**: System Biometrics (Fingerprint/Face) + PIN keypad.

            ---
            ### 📥 Installation:
            1. Download `Privix-${{ steps.prepare_apk.outputs.target_tag }}.apk` below under **Assets**.
            2. Install on Android 7.0+ (API 24+).
            3. Grant **Accessibility Service** and **Draw Over Apps** permissions when prompted.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
