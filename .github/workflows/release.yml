name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          # Grabs the version string from pubspec.yaml
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "Extracted version: v$VERSION"

      - name: Verify tag matches pubspec.yaml
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # Check if the pushed tag matches the version in pubspec.yaml
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [ "$TAG_NAME" != "${{ env.APP_VERSION }}" ]; then
            echo "Error: Pushed tag ($TAG_NAME) does not match version in pubspec.yaml (${{ env.APP_VERSION }})."
            exit 1
          fi
          echo "Tag $TAG_NAME successfully matches pubspec.yaml version."

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
